<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지훈 렌탈샵 | 시안 비교</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eaee;color:#151719;font-family:Arial,"Malgun Gothic",sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}header{height:72px;padding:0 28px;background:#141820;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:19px;margin:0;letter-spacing:-.6px}h1 span{font-size:11px;font-weight:400;color:#a3acba;margin-left:16px}.header-link{font-size:12px;color:#d6dce4}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;background:white;border-bottom:1px solid #cdd2da;padding:14px 28px}.tabs,.view-tools{display:flex;gap:7px}.tabs button,.view-tools button,.view-tools a{padding:10px 16px;border:1px solid #cdd2da;background:white;font-size:12px}.tabs button[aria-selected=true],.view-tools button[aria-pressed=true]{background:#164dc1;color:#fff;border-color:#164dc1}.view-tools a{background:#202630;color:white;border-color:#202630}.description{padding:12px 28px;color:#606975;font-size:12px;background:#f4f5f7;display:flex;justify-content:space-between;gap:15px}.stage{height:calc(100dvh - 181px);min-height:400px;padding:18px;display:flex;justify-content:center;gap:18px;overflow:auto}.pane{width:100%;height:100%;display:flex;flex-direction:column;background:white;border:1px solid #c8cdd5;min-width:0}.pane[hidden]{display:none}.pane-label{padding:9px 14px;font-size:10px;font-weight:bold;letter-spacing:1px;border-bottom:1px solid #d3d8df;background:#fff;display:flex;justify-content:space-between}.pane-label a{text-decoration:underline;font-weight:400;letter-spacing:0}.pane iframe{border:0;width:100%;height:100%;flex:1;min-height:0;background:white}.stage.mobile .pane{max-width:390px;flex-shrink:0}.stage.compare .pane{width:50%}.stage.compare.mobile .pane{width:390px}button:focus-visible,a:focus-visible{outline:3px solid #90b7ff;outline-offset:3px}@media(max-width:760px){header{padding:0 16px;height:65px}h1{font-size:16px}h1 span{display:block;margin:4px 0 0;font-size:10px}.header-link{font-size:10px}.toolbar{padding:12px;flex-wrap:wrap;gap:10px}.tabs,.view-tools{flex:1}.tabs button{flex:1}.tabs button,.view-tools button,.view-tools a{padding:9px;font-size:11px}.view-tools a{margin-left:auto}.description{padding:10px 14px;font-size:10px}.description span:last-child{display:none}.stage{height:calc(100dvh - 217px);padding:8px;gap:8px}.stage.compare{justify-content:flex-start}.stage.compare .pane{min-width:360px}.stage.mobile .pane{max-width:390px}}
</style></head>
<body><header><h1>지훈 렌탈샵 <span>WEBSITE DESIGN REVIEW</span></h1><a class="header-link" href="index2.html" target="_blank" rel="noopener">새 시안 독립 화면 ↗</a></header>
<div class="toolbar"><div class="tabs" role="tablist" aria-label="시안 선택"><button role="tab" aria-selected="false" tabindex="-1" aria-controls="stage" data-mode="one">시안 01 · 기존</button><button role="tab" aria-selected="true" aria-controls="stage" data-mode="two">시안 02 · 직선형</button><button role="tab" aria-selected="false" tabindex="-1" aria-controls="stage" data-mode="compare">두 시안 비교</button></div><div class="view-tools"><button id="desktop" aria-pressed="true">PC 화면</button><button id="mobile" aria-pressed="false">모바일 화면</button><a id="new-window" href="index2.html" target="_blank" rel="noopener">새 창에서 보기 ↗</a></div></div>
<div class="description"><span id="description">시안 02 — 직선형 레이아웃 / 요금표 중심 / 시즌 안내 팝업</span><span>실제 예약·결제는 연결되지 않은 디자인 시안입니다.</span></div>
<main class="stage" id="stage" aria-label="사이트 미리보기"><section class="pane" id="pane-one" hidden aria-label="시안 01"><div class="pane-label">DESIGN 01 / ORIGINAL <a href="index1.html" target="_blank" rel="noopener">단독 보기 ↗</a></div><iframe id="frame-one" title="지훈 렌탈샵 시안 01" data-src="index1.html"></iframe></section><section class="pane" id="pane-two" aria-label="시안 02"><div class="pane-label">DESIGN 02 / COMMERCIAL <a href="index2.html" target="_blank" rel="noopener">단독 보기 ↗</a></div><iframe title="지훈 렌탈샵 시안 02" src="index2.html"></iframe></section></main>
<script>
const stage=document.querySelector('#stage');const tabs=[...document.querySelectorAll('[data-mode]')];
function select(mode){tabs.forEach(b=>{const on=b.dataset.mode===mode;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;});document.querySelector('#pane-one').hidden=mode==='two';document.querySelector('#pane-two').hidden=mode==='one';stage.classList.toggle('compare',mode==='compare');const frame=document.querySelector('#frame-one');if(mode!=='two'&&!frame.getAttribute('src'))frame.src=frame.dataset.src;document.querySelector('#new-window').href=mode==='one'?'index1.html':'index2.html';document.querySelector('#description').textContent=mode==='one'?'시안 01 — 기존 디자인 / 일러스트 / 그린 컬러':mode==='two'?'시안 02 — 직선형 레이아웃 / 요금표 중심 / 시즌 안내 팝업':'두 시안 나란히 비교 — 각 화면 안에서 독립적으로 스크롤할 수 있습니다.';}
 tabs.forEach((b,i)=>{b.addEventListener('click',()=>select(b.dataset.mode));b.addEventListener('keydown',e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else if(e.key==='Home')n=0;else if(e.key==='End')n=2;else return;e.preventDefault();select(tabs[n].dataset.mode);tabs[n].focus();});});
function resize(mobile){stage.classList.toggle('mobile',mobile);document.querySelector('#mobile').setAttribute('aria-pressed',String(mobile));document.querySelector('#desktop').setAttribute('aria-pressed',String(!mobile));}document.querySelector('#mobile').addEventListener('click',()=>resize(true));document.querySelector('#desktop').addEventListener('click',()=>resize(false));
</script></body></html>
